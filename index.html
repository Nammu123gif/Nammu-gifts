<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nammu Gift - Online Gift Shop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    header {
      background-color: #ff6f61;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #333;
    }
    nav a {
      color: white;
      padding: 1rem;
      text-decoration: none;
    }
    nav a:hover {
      background-color: #555;
    }
    .container {
      padding: 2rem;
    }
    .product {
      background: white;
      border: 1px solid #ddd;
      padding: 1rem;
      margin: 1rem 0;
    }
    .product img {
      max-width: 100%;
    }
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    #cart {
      margin-top: 2rem;
      background: white;
      padding: 1rem;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to Nammu Gift</h1>
    <p>Your one-stop shop for thoughtful gifts</p>
  </header>
  <nav>
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
  <div class="container" id="shop">
    <h2>Featured Gifts</h2>
    <div class="product">
      <img src="https://via.placeholder.com/300x200" alt="Gift 1">
      <h3>Customized Mug</h3>
      <p>Price: ₹299</p>
      <button onclick="addToCart('Customized Mug', 299)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300x200" alt="Gift 2">
      <h3>Birthday Hamper</h3>
      <p>Price: ₹799</p>
      <button onclick="addToCart('Birthday Hamper', 799)">Add to Cart</button>
    </div>
    <div id="cart">
      <h3>Shopping Cart</h3>
      <ul id="cart-items"></ul>
      <p id="total">Total: ₹0</p>
    </div>
  </div>
  <footer>
    <p>&copy; 2025 Nammu Gift. All rights reserved.</p>
  </footer>

  <script>
    const cart = [];

    function addToCart(product, price) {
      cart.push({ product, price });
      updateCart();
    }

    function updateCart() {
      const cartItems = document.getElementById('cart-items');
      const totalEl = document.getElementById('total');
      cartItems.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.product} - ₹${item.price}`;
        cartItems.appendChild(li);
        total += item.price;
      });

      totalEl.textContent = `Total: ₹${total}`;
    }
  </script>
</body>
</html>
